spring.application.name=student-placement-management

spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/student_placement_management
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=studentPlacementManagementSecretKeyForJwtAuthentication2026SecureKey
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

logging.level.root=INFO
logging.level.com.example.studentplacementmanagement=INFO

logging.file.name=logs/student-placement-management.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Student Placement Management System
info.app.description=Student Placement and Recruitment Management System
info.app.version=1.0.0

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=StudentPlacementHikariPool
